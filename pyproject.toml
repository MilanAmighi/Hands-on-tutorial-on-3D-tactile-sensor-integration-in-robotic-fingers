[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2_tactile_robot"
version = "0.0.1"
description = "Tutorial - Tactile Sensors"
authors = [
  { name = "-" },
]
requires-python = ">=3.12"

# PyPI pip packages
dependencies = [
    "icecream>=2.1.3",
    "loguru>=0.7.3",
    "numpy>=2.1.2",
    "pyprojroot>=0.3.0",
    "sitepath>=0.4.0",
    "typer>=0.16.1",
    "tqdm>=4.68.1",
    "pyserial>=3.5",
    "crc>=7.1.0",
    "esptool>=5.3.0",
    "pydantic-settings>=2.14.1",
    "pyserial-asyncio>=0.6",
    "pyyaml>=6.0.3",
    "matplotlib>=3.10.9",
    "pytest>=8.4.2",
    "scipy>=1.11.0",
]



# ==========================================
# PIXI CONFIGURATION
# ==========================================
[tool.pixi.workspace]
channels = ["https://prefix.dev/robostack-humble", "conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
# Links the ROS2 package from the workspace as an editable pip install
ros2_tactile_robot = { path = "Codes/ros2_ws/src/ros2_tactile_robot", editable = true }

[tool.pixi.dependencies]
# Core ROS 2 and Build Tools (Conda packages)
ros-humble-desktop = "*"
python = ">=3.12"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
colcon-common-extensions = "*"

[tool.pixi.tasks]
build = { cmd = "colcon build --base-paths src --build-base build --install-base install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY", cwd = "Codes/ros2_ws" }

launch-all ={ cmd = "bash -c 'source install/setup.bash && export AMENT_PREFIX_PATH=\"$PIXI_PROJECT_ROOT/Codes/ros2_ws/install/ros2_tactile_robot:$AMENT_PREFIX_PATH\" && ros2 launch ros2_tactile_robot full_system.launch.py'", cwd = "Codes/ros2_ws" }

pid = { cmd = "bash -c 'source Codes/ros2_ws/install/setup.bash && export AMENT_PREFIX_PATH=\"$PIXI_PROJECT_ROOT/Codes/ros2_ws/install/ros2_tactile_robot:$AMENT_PREFIX_PATH\" && ros2 launch ros2_tactile_robot pid_force_control.launch.py'" }

tactile-viz = { cmd = "bash -c 'source Codes/ros2_ws/install/setup.bash && export AMENT_PREFIX_PATH=\"$PIXI_PROJECT_ROOT/Codes/ros2_ws/install/ros2_tactile_robot:$AMENT_PREFIX_PATH\" && trap \"kill 0\" EXIT; ros2 run ros2_tactile_robot esp_bridge_node & ros2 run ros2_tactile_robot tactile_finger_gui_node'" }

motor = { cmd = "python Motor_initialisation.py", cwd = "Codes/python_codes" }
burst-gui = { cmd = "python BurstMode.py", cwd = "Codes/python_codes" }
connected = { cmd = "python simple_connected_mode.py", cwd = "Codes/python_codes" }
flash = { cmd = "python flash/flash.py", cwd = "Codes/python_codes" }


# Repairs the Homebrew-hardcoded Ogre libraries so rviz2 can start.
# Applies to osx-64 and osx-arm64;
[tool.pixi.target.osx.activation]
scripts = ["macos_rviz_ogre_libs.sh"]


[tool.pixi.target.win-64.tasks]
# ==========================================
# WINDOWS OVERRIDES (Brute-Force Path Injection)
# ==========================================

# NOTE: do not inject PYTHONPATH here. The package is already importable through the
# editable pip install, and the extra entry is inherited by every child process rviz2 included.
#
# NOTE: ROS_LOCALHOST_ONLY=1 restricts DDS discovery to the loopback interface. Everything
# here runs on a single laptop, and loopback traffic bypasses Windows Firewall entirely, so
# this avoids the "Windows Defender Firewall has blocked some features" dialog that
# non-admin users can't click through.
#
# NOTE: rviz2 is started directly by launch_all_windows.ps1 rather than through
# `ros2 launch`'s ExecuteProcess -- see that script for why (a Windows-only rviz2 crash).
launch-all = { cmd = "powershell.exe -NoProfile -ExecutionPolicy Bypass -File launch_all_windows.ps1", cwd = "Codes/ros2_ws" }

pid = { cmd = "cmd.exe /c \"set AMENT_PREFIX_PATH=%cd%\\install\\ros2_tactile_robot;%AMENT_PREFIX_PATH% && set ROS_LOCALHOST_ONLY=1 && ros2 launch ros2_tactile_robot pid_force_control.launch.py\"", cwd = "Codes/ros2_ws" }

# NOTE: cmd.exe uses '&' as a *sequential* separator, not as bash's background operator,
# so the bridge must be started with 'start /b' or the GUI node would never run.
tactile-viz = { cmd = "cmd.exe /c \"set AMENT_PREFIX_PATH=%cd%\\install\\ros2_tactile_robot;%AMENT_PREFIX_PATH% && set ROS_LOCALHOST_ONLY=1 && start /b ros2 run ros2_tactile_robot esp_bridge_node && ros2 run ros2_tactile_robot tactile_finger_gui_node\"", cwd = "Codes/ros2_ws" }